services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sap-freelancer-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sap_freelancer_portal
      DB_USER: postgres
      DB_PASSWORD: root
      FE_URL: http://localhost:3001
      PDF_PUBLIC_URL: http://localhost:3000/pdf/
      SESSION_SECRET: super-secret
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-P9 systems}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_CALLBACK_URL: http://localhost:3000/auth/linkedin/callback
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./uploads:/app/uploads
      - ./pdf:/app/pdf

  db:
    image: postgres:16-alpine
    container_name: sap-freelancer-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sap_freelancer_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sap_freelancer_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
